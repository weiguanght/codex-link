[package]
name = "ios-latex"
version = "0.1.0"
edition.workspace = true
license = "MIT"

[lib]
crate-type = ["staticlib", "rlib"]

[features]
default = ["mhchem"]
mhchem = ["ratex-parser/mhchem", "ratex-layout/mhchem"]

[dependencies]
